# -- general
#set-option default-path "$PWD"

setw -g xterm-keys on
set -s escape-time 0
set -sg repeat-time 300
set -s focus-events on
set -g default-terminal "screen-256color"
set -g mouse on
set -sg exit-empty on

set -q -g status-utf8 on
setw -q -g utf8 on

set -g visual-activity off
setw -g monitor-activity off
setw -g monitor-bell off

set -g history-limit 10000

# reload configuration
bind r source-file ~/.tmux.conf \; display '~/.tmux.conf sourced'

# perfix
unbind C-b
set -g prefix C-s
bind C-s send-prefix
bind c new-window

# display
set -g base-index 1
setw -g pane-base-index 1

setw -g automatic-rename on
set -g renumber-windows on

## 设置终端标题
set -g set-titles on
## set -g set-titles-string '#I:#W'

set -g display-panes-time 2000
set -g display-time 2000
## 设置状态bar的颜色和风格	
set -g status-interval 10
set -g status-position bottom
set -g status-style fg=black,bg=default
set -g status-left ''
set -g status-right '%H:%M'


## 设置tab的风格 window-staus-current-style(活跃tab) window-status-style(未选中tab)
## window-statux-xx-format 设置活跃/非活跃tab的窗口标签显示格式
set -g window-status-current-style 'bg=red, underscore'
set -g window-status-style 'bg=white,underscore'

## 设置活动/非活动的pane的边框样式
set -g pane-active-border-style 'fg=red,bg=default'
set -g pane-border-format '#[bold]#{pane_title}#[default]'
set -g mode-keys vi

# 创建session
bind C-c new-session

# bind -n 表示绑定一个无需前缀键位的快捷键
# window management
bind -n M-o new-window -c "#{pane_current_path}"
bind -n M-O break-pane
bind -n M-Q kill-pane

# window navigation
unbind n
unbind p
unbind 1
unbind 2
unbind 3
unbind 4
unbind 5
unbind 6
unbind 7
unbind 8
unbind 9
unbind 0

#-r 可重复绑定，之际按-r后面的按键无需添加前缀
# -n 无前缀绑定

bind -r C-p previous-window
bind -r C-n next-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9


bind -n M-! join-pane -t :1
bind -n M-@ join-pane -t :2
bind -n 'M-#' join-pane -t :3
bind -n 'M-$' join-pane -t :4
bind -n M-% join-pane -t :5
bind -n M-^ join-pane -t :6
bind -n M-& join-pane -t :7
bind -n M-* join-pane -t :8
bind -n M-( join-pane -t :9

bind u split-window -vb -c "#{pane_current_path}"
bind e split-window -v -c "#{pane_current_path}"
bind n split-window -hb -c "#{pane_current_path}"
bind i split-window -h -c "#{pane_current_path}"

bind -n M-f resize-pane -Z


bind 1 select-pane -t:.1
bind 2 select-pane -t:.2
bind 3 select-pane -t:.3
bind 4 select-pane -t:.4
bind 5 select-pane -t:.5
bind 6 select-pane -t:.6
bind 7 select-pane -t:.7
bind 8 select-pane -t:.8
bind 9 select-pane -t:.9
bind 0 select-pane -t:.10

# swap current pane with the next one
bind > swap-pane -D
# swap current pane with the previous one
bind < swap-pane -U
bind | swap-pane
#bind -n M-space next-layout

bind -n M-N resize-pane -L 2
bind -n M-E resize-pane -D 2
bind -n M-U resize-pane -U 2
bind -n M-I resize-pane -R 2




